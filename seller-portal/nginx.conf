server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Asset filenames are content-hashed by Vite, so they can be cached forever.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The entry point must never be cached, otherwise a redeploy would keep
  # serving the previous build's hash names until every cache expired.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri /index.html;
  }
}
